<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header"></div>

<div class="center-box">
  <div class="form-container" id="signup">

    <form class="login-form" id="signup-form" action="index.html" novalidate>
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="Email" required>
      </div>

      <div class="form-row">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Password" required>
      </div>

      <p id="password-error" class="error-msg"></p>

      <div class="button-center">
        <button type="submit">Signup</button>
      </div>
    </form>

  </div>
</div>

<div id="footer"></div>
<script>

  fetch("components/header.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;

      // ⭐ Load dropdown script AFTER header is inserted
      const script = document.createElement("script");
      script.src = "res/scripts/dropdown.js";
      document.body.appendChild(script);
    });

  fetch("components/footer.html")
    .then(r => r.text())
    .then(html => document.getElementById("footer").innerHTML = html);
</script>
<script src="res/scripts/signupvalidation.js"></script>
</body>
</html>
